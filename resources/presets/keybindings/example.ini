; @label Example
; @description Empty preset with inline comments documenting the chord-line format. Applying it as-is is harmless — produces an empty [UserDefinedChords] section.

; ==============================================================================
; Master for EditorKeyBindings.ini — annotated starting point.
; Applied per engine version into:
;   Windows  %LOCALAPPDATA%\UnrealEngine\<major.minor>\Saved\Config\WindowsEditor\EditorKeyBindings.ini
;   macOS    ~/Library/Application Support/Epic/UnrealEngine/<major.minor>/Saved/Config/MacEditor/EditorKeyBindings.ini
;   Linux    ~/.config/Epic/UnrealEngine/<major.minor>/Saved/Config/LinuxEditor/EditorKeyBindings.ini
;
; The whole [UserDefinedChords] section uses repeated UserDefinedChords= lines
; (a TArray of strings on the engine side). ReHoarder treats every key that
; appears more than once as an array-replace target — listing your chords here
; wipes Epic's defaults for those bindings and inserts yours instead.
;
; Each chord line is an escaped JSON object: ~Quote~ ~OpenBracket~ ~CloseBracket~
; stand in for " { } respectively. ChordIndex 0 = primary, 1 = secondary.
;
; The simplest way to author entries: bind a shortcut in the editor, export the
; resulting EditorKeyBindings.ini, copy the relevant lines into this file.
; ==============================================================================

[UserDefinedChords]
; Example (commented out — uncomment and edit to use):
;   UserDefinedChords=~OpenBracket~~Quote~BindingContext~Quote~:~Quote~LevelEditor~Quote~,~Quote~CommandName~Quote~:~Quote~OpenPlaceActors~Quote~,~Quote~ChordIndex~Quote~:0,~Quote~Control~Quote~:false,~Quote~Alt~Quote~:false,~Quote~Shift~Quote~:false,~Quote~Command~Quote~:false,~Quote~Key~Quote~:~Quote~None~Quote~~CloseBracket~
